name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  package:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows x64,        os: windows-latest }
          - { name: Linux x64,          os: ubuntu-latest }
          - { name: Linux arm64,        os: ubuntu-24.04-arm }
          - { name: macOS Apple Silicon, os: macos-15 }
          - { name: macOS Intel,        os: macos-15-intel }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: Linux packaging tools
        if: runner.os == 'Linux'
        # rpm/fakeroot for packaging; GL/fontconfig/X libs so Skia loads in headless tests (missing on the arm64 image).
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm fakeroot libgl1 libegl1 libfontconfig1 libfreetype6 libx11-6 libxext6 libxrender1 libxi6 libxtst6 libxrandr2

      - name: Test
        run: ./gradlew :composeApp:jvmTest --no-configuration-cache
        env:
          MF_DATA_DIR: ${{ runner.temp }}/mf-data

      - name: Package
        run: ./gradlew :composeApp:packageDistributionForCurrentOS --no-configuration-cache

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: material-frontend-${{ matrix.os }}
          path: |
            composeApp/build/compose/binaries/main/*/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
          draft: true
